spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/http_conform}
    username: ${SPRING_DATASOURCE_USERNAME:http_conform}
    password: ${SPRING_DATASOURCE_PASSWORD:http_conform}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
