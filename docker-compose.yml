services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: http_conform
      POSTGRES_USER: http_conform
      POSTGRES_PASSWORD: http_conform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/http_conform
      SPRING_DATASOURCE_USERNAME: http_conform
      SPRING_DATASOURCE_PASSWORD: http_conform
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
